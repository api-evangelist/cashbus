description: 'CashBus (现金巴士), operated by Micro-Credit Speed Express (Group) Co., Ltd.
  (微额速达集团有限公司) of Shanghai, is a Chinese mobile financial-technology platform providing
  quick microloans to underserved consumers who lack access to traditional banking. The
  company runs an automated, AI-driven credit decision engine that scores applicants in
  seconds using thousands of risk factors and big-data analysis, with risk management spanning
  pre-loan, in-loan, and post-loan stages. Surfaced as a portfolio company of Qiming Venture
  Partners and added to the API Evangelist network. The public presence is a corporate
  marketing site (company vision, team, careers, contact) with no published developer portal,
  API documentation, or machine-readable API surface at this time.'
